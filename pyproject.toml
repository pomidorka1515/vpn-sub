[project]
name = "vpn-sub"
version = "0.0.0" # just use tags. this isnt a package you install
description = "VPN subscription management service. Flask + Telegram bots + 3x-ui panel glue."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "pyTelegramBotAPI>=4.15.0",
    "Flask>=3.0.0",
    "qrcode>=7.4",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "gunicorn>=21.0.0",
    "dacite",
    "psutil",
    "aiohttp",
    "argon2-cffi>=23.1.0",
    "discord.py>=2.4"
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "mypy>=1.15",
    "pyright",
    "pytest>=8.0",
    "types-gunicorn",
    "types-requests>=2.31",
    "types-jsonschema>=4.23",
    "types-Pillow>=10.2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "app", "chart", "builders",
    "bwatch", "custom_types",
    "loggers", "session", "util", "errors"
]
packages = [
    "api",
    "api.decorators",
    "config",
    "core",
    "bots",
    "bots.admin",
    "bots.public",
    "db",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
cache_dir = "$MYPY_CONFIG_FILE_DIR/.mypy_cache"
# IMPORTANT: discord launcher collides with `src/app.py`,
# the actual implementation is in `src/discord/src/runtime.py`, this file doesn't need type checking.
exclude = ['src/discord/src/app.py']

files = [
    "src/config/",
    "src/bots/",
    "src/db/",
    "src/custom_types.py",
    "src/loggers.py",
    "src/session.py",
    "src/chart.py",
    "src/bwatch.py",
    "src/api/",
    "src/app.py",
    "src/util.py",
    "src/errors.py",
    "src/builders.py",
    "src/tests/",
    "src/core/",
    "src/discord/src/",
    "scripts/"
]

# -- strict mode --------------------------------------------------------
# Listed individually (instead of strict = true) so per-module relaxations
# below are legible: you can see exactly which flags are being turned off
# and why, rather than guessing which subset of --strict is in play.
disallow_any_generics          = true
disallow_untyped_calls         = true
disallow_untyped_defs          = true
disallow_incomplete_defs       = true
disallow_subclassing_any       = true
check_untyped_defs             = true
disallow_untyped_decorators    = true
warn_redundant_casts           = true
warn_unused_ignores            = true
warn_return_any                = true
no_implicit_reexport           = true
strict_equality                = true
strict_optional                = true
extra_checks                   = true

# -- extra quality flags ------------------------------------------------
warn_unreachable    = true   # dead code after raise / return / assert False
warn_unused_configs = true   # catch stale per-module overrides
# -- output -------------------------------------------------------------
pretty              = true
show_error_codes    = true
show_column_numbers = true
show_error_context  = true

# -- per-module relaxations ---------------------------------------------
# config is split across private implementation modules that access each
# other's private helpers during the refactor
[[tool.mypy.overrides]]
module = ["config", "config.*"]
no_implicit_reexport           = false
disable_error_code             = ["attr-defined", "override"]

# Database mixins share connection/transaction helpers supplied by Database.
[[tool.mypy.overrides]]
module = ["db", "db.*"]
disable_error_code             = ["attr-defined"]

# Bt feature mixins intentionally depend on attributes supplied by the concrete
# composition roots; pyTelegramBotAPI is also only partially typed.
[[tool.mypy.overrides]]
module = ["bots.*"]
disallow_untyped_calls         = false
disallow_any_expr              = false
disable_error_code             = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["public.*", "admin.*"]
disallow_untyped_calls         = false
disable_error_code             = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["helpers"]
disallow_untyped_calls         = false

# -- pylance compatibility ----------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
include = [
    "src/config/",
    "src/bots/",
    "src/db/",
    "src/custom_types.py",
    "src/loggers.py",
    "src/session.py",
    "src/chart.py",
    "src/bwatch.py",
    "src/api/",
    "src/app.py",
    "src/util.py",
    "src/errors.py",
    "src/builders.py",
    "src/tests/",
    "src/core/",
    "src/discord/src/",
    "scripts/"
]
exclude = [
    "venv",
    ".venv",
    "**/__pycache__"
]
typeCheckingMode = "strict"
reportDeprecated = false
venvPath = "."
venv = "venv"
useLibraryCodeForTypes = false # why the fuck is this on by default

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/config"
reportPrivateUsage = false
reportUnusedFunction = false
reportIncompatibleMethodOverride = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/db"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src", "src/tests"]
root = "src/tests"

[[tool.pyright.executionEnvironments]]
extraPaths = ["src/discord/src", "src"]
root = "src/discord/src"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src", "src/discord/src", "src/discord/src/tests"]
root = "src/discord/src/tests"

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "scripts"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/discord/src"]
testpaths = ["src/tests", "src/discord/src/tests"]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]
