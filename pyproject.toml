[project]
name = "vpn-sub"
version = "0.0.0" # just use tags
description = "VPN subscription management service. Flask + Telegram bots + 3x-ui panel glue."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "pyTelegramBotAPI>=4.15.0",
    "Flask>=3.0.0",
    "qrcode>=7.4",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "gunicorn>=21.0.0",
    "dacite",
    "psutil",
    "argon2-cffi>=23.1.0"
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "mypy>=1.15",
    "types-requests>=2.31",
    "types-jsonschema>=4.23",
    "types-Pillow>=10.2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app", "api", "bots", "chart",
    "config", "core", "bwatch", "custom_types", "db",
    "loggers", "session", "util", "errors", "protocols"
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"

files = [
    "config.py",
    "db.py",
    "custom_types.py",
    "loggers.py",
    "session.py",
    "chart.py",
    "core.py",
    "bwatch.py",
    "api.py",
    "bots.py",
    "app.py",
    "util.py",
    "errors.py",
    "protocols.py",
    "tests/",
]

# -- strict mode --------------------------------------------------------
# Listed individually (instead of strict = true) so per-module relaxations
# below are legible: you can see exactly which flags are being turned off
# and why, rather than guessing which subset of --strict is in play.
disallow_any_generics          = true
disallow_untyped_calls         = true
disallow_untyped_defs          = true
disallow_incomplete_defs       = true
disallow_subclassing_any       = true
check_untyped_defs             = true
disallow_untyped_decorators    = true
warn_redundant_casts           = true
warn_unused_ignores            = true
warn_return_any                = true
no_implicit_reexport           = true
strict_equality                = true
strict_optional                = true
extra_checks                   = true

# -- extra quality flags ------------------------------------------------
warn_unreachable    = true   # dead code after raise / return / assert False
warn_unused_configs = true   # catch stale per-module overrides
# -- output -------------------------------------------------------------
pretty              = true
show_error_codes    = true
show_column_numbers = true
show_error_context  = true

# -- per-module relaxations ---------------------------------------------
# pyTelegramBotApi lacks proper typing,
# all other modules are fine
[[tool.mypy.overrides]]
module = ["bots"]
disallow_untyped_calls         = false
# -- pylance compatibility ----------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
include = [
    "config.py",
    "db.py",
    "custom_types.py",
    "loggers.py",
    "session.py",
    "chart.py",
    "core.py",
    "bwatch.py",
    "api.py",
    "bots.py",
    "app.py",
    "util.py",
    "errors.py",
    "protocols.py",
    "tests/",
]
typeCheckingMode = "strict"
reportDeprecated = false
venvPath = "."
venv = "venv"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
