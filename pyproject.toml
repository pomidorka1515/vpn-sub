
[project]
name = "vpn-sub"
version = "0.0.0" # just use tags. this isnt a package you install
description = "VPN subscription management service. Flask + Telegram bots + 3x-ui panel glue."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.14" # 3.13 is supported, 3.14 for development
dependencies = [
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "pyTelegramBotAPI>=4.15.0",
    "Flask>=3.0.0",
    "qrcode>=7.4",
    "Pillow>=10.0.0",
    "gunicorn>=21.0.0",
    "dacite",
    "psutil",
    "aiohttp",
    "argon2-cffi>=23.1.0",
    "discord.py>=2.4",
    "redis>=5.0.0"
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "ruff>=0.17",
    "mypy>=1.15",
    "pyright",
    "pytest>=8.0",
    "types-gunicorn",
    "types-psutil",
    "types-qrcode",
    "types-requests>=2.31",
    "types-jsonschema>=4.23",
    "types-Pillow>=10.2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Discover packages and top-level modules automatically from src/.
package-dir = {"" = "src"}

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314" # Match the development Python version
src = ["src", "src/discord/src"] # First-party import roots

[tool.ruff.lint]
# ALL normally excludes preview rules, including newer modernization checks.
preview = true
explicit-preview-rules = false
future-annotations = true
typing-extensions = false # Fixes must not introduce the banned backport
select = [
	"ALL",     # Very evil.
]

ignore = [
    "RUF001",  # Unicode characters in strings are intentional
    "RUF002",  # Unicode characters in docstrings are intentional
    "RUF003",  # Unicode characters in comments are intentional
    "E501",    # Line length is not enforced
    "PLR2004", # Literal comparisons do not need named constants
    "PLC0415", # Lazy imports are intentional
    "E701",    # Compact single-line compound statements are allowed
    "PLR0904", # Public method counts are not limited
    "PLR0911", # Return counts are not limited
    "PLR0912", # Branch counts are not limited
    "PLR0913", # Argument counts are not limited
    "PLR0914", # Local variable counts are not limited
    "PLR0915", # Statement counts are not limited
    "PLR0916", # Boolean expression counts are not limited
    "PLR0917", # Positional argument counts are not limited
    "TID252",  # Relative imports are allowed
    "F403",    # Star imports are intentional
    "F405",    # Mypy/pyright check names introduced by star imports
    "SIM117",  # Nested context managers preserve intentional test structure
    "SIM102",  # Nested conditionals are allowed
    "PLW2901", # Loop variables may be reassigned
    "G003",    # Concatenated logging messages are allowed
    "G004",    # F-string logging messages are allowed
    "TRY003",  # Exception messages may be supplied at the raise site
    "TRY301",  # Explicit raises may remain inside try blocks
    "TRY300",  # Successful try paths do not require else blocks
    "TRY004",  # Invalid argument types do not require TypeError
    "S110",    # Deliberately suppressed exceptions may use pass
    "S311",    # Non-cryptographic random choices are intentional
    "S603",    # Subprocess calls are intentional
    "TC006",   # Runtime types are allowed in cast() calls
    "BLE",     # Exceptions are audited independently from ruff
    "ARG005",  # Libraries require arguments when passing callables
    "D10",     # Undocumented functions/classes/etc are fine
    "D2",      # Line break magic; wont bother
    "D401",    # No idea what this wants from me
    "CPY001",  # Copyright notices are useless
    "EM10",    # I don't know why strings in exceptions can be bad
    "FBT00",   # Boolean parameters are not bad
    "C901",    # Method names aren't complex
    "D417",    # Docstrings often intentionally omit some arguments
    "N806",    # Some constants are flagged
    "DOC201",
    "DOC501",
    "DOC402",
    "PLR6301",
    "E261",
    "S404",
    "RUF029",
]

# Whitespace-only fixes are safe even inside multiline strings.
extend-safe-fixes = ["W293", "W291"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false # Modernize annotations even when evaluated at runtime

[tool.ruff.lint.flake8-type-checking]
# Check each annotation-only import, even alongside runtime imports from its module.
strict = true
quote-annotations = false # Prefer postponed annotations over string annotations

[tool.ruff.lint.per-file-ignores]
# CLI output goes directly to the terminal.
"src/cli/*" = ["T201"]
# File mirrors x-ui keys.
"src/custom_types.py" = ["N815", "ERA001"]
# Standalone scripts may print user-facing output and intentionally have unused arguments.
"scripts/*" = ["T201", "ARG", "INP001"]
# Op() class has lowercase nested classes.
"src/tracer.py" = ["N801"]
# Test helpers intentionally exercise dynamic attributes and insecure fixtures.
"**/tests/*" = [
    "B009",   # getattr() with a constant name is useful in attribute tests
    "B010",   # setattr() with a constant name is useful in attribute tests
    "RUF012", # Mutable class attributes are intentional in test doubles
    "S101",   # Pytest uses assert statements
    "S108",   # Temporary path literals are test fixtures
    "S106",   # Hardcoded password arguments are test fixtures
    "S105",   # Hardcoded password strings are test fixtures
    "S324",   # Weak hashes may be exercised by compatibility tests
    "ARG",    # Unused arguments/etc are useful in tests
    "SLF001", # Private access is unavoidable in tests
    "PLC2701",# 
    "INP001", # Tests are not meant to be imported
    "B903",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Require PEP 695 generics/type aliases and stdlib typing.
"typing.TypeVar".msg = "Use 3.12 syntax: `class MyClass[T]:` or `def func[T]():`"
"typing.ParamSpec".msg = "Use 3.12 syntax."
"typing.TypeVarTuple".msg = "Use PEP 695 syntax: `class MyClass[*Ts]:` or `def func[*Ts]():`."
"typing.Generic".msg = "Use 3.12 syntax."
"typing.Union".msg = "Use the union operator (` | `)."
"typing.Optional".msg = "Use the union operator (` | None`)."
"typing.TypeAlias".msg = "Use 3.12 syntax: `type Alias = ...`"
"typing.AnyStr".msg = "Use a constrained PEP 695 type parameter: `def func[T: (str, bytes)](...):`."
"typing.no_type_check_decorator".msg = "Deprecated decorator; preserve and annotate callable signatures."
"typing.io".msg = "Import IO, TextIO, or BinaryIO directly from `typing`."
"typing.re".msg = "Use `re.Pattern` and `re.Match`."
"typing_extensions".msg = "Use stdlib `typing`."

# Built-in types
"typing.List".msg = "Use built-in `list`."
"typing.Dict".msg = "Use built-in `dict`."
"typing.Tuple".msg = "Use built-in `tuple`."
"typing.Set".msg = "Use built-in `set`."
"typing.FrozenSet".msg = "Use built-in `frozenset`."
"typing.Type".msg = "Use built-in `type`."

# Collections
"typing.DefaultDict".msg = "Use `collections.defaultdict`."
"typing.OrderedDict".msg = "Use `collections.OrderedDict`."
"typing.ChainMap".msg = "Use `collections.ChainMap`."
"typing.Counter".msg = "Use `collections.Counter`."
"typing.Deque".msg = "Use `collections.deque`."

# Other concrete types
"typing.Pattern".msg = "Use `re.Pattern`."
"typing.Match".msg = "Use `re.Match`."
"typing.Text".msg = "Use `str`."

# Enforce collections.abc over typing
"typing.AbstractSet".msg = "Use `collections.abc.Set`."
"typing.ByteString".msg = "Use `collections.abc.Buffer`."
"collections.abc.ByteString".msg = "Use `collections.abc.Buffer`; ByteString is deprecated."
"typing.Callable".msg = "Use `collections.abc.Callable`."
"typing.Collection".msg = "Use `collections.abc.Collection`."
"typing.Container".msg = "Use `collections.abc.Container`."
"typing.ItemsView".msg = "Use `collections.abc.ItemsView`."
"typing.KeysView".msg = "Use `collections.abc.KeysView`."
"typing.Mapping".msg = "Use `collections.abc.Mapping`."
"typing.MappingView".msg = "Use `collections.abc.MappingView`."
"typing.MutableMapping".msg = "Use `collections.abc.MutableMapping`."
"typing.MutableSequence".msg = "Use `collections.abc.MutableSequence`."
"typing.MutableSet".msg = "Use `collections.abc.MutableSet`."
"typing.Sequence".msg = "Use `collections.abc.Sequence`."
"typing.ValuesView".msg = "Use `collections.abc.ValuesView`."
"typing.Iterable".msg = "Use `collections.abc.Iterable`."
"typing.Iterator".msg = "Use `collections.abc.Iterator`."
"typing.Generator".msg = "Use `collections.abc.Generator`."
"typing.Hashable".msg = "Use `collections.abc.Hashable`."
"typing.Reversible".msg = "Use `collections.abc.Reversible`."
"typing.Sized".msg = "Use `collections.abc.Sized`."

# Asynchronous ABCs
"typing.Coroutine".msg = "Use `collections.abc.Coroutine`."
"typing.AsyncGenerator".msg = "Use `collections.abc.AsyncGenerator`."
"typing.AsyncIterable".msg = "Use `collections.abc.AsyncIterable`."
"typing.AsyncIterator".msg = "Use `collections.abc.AsyncIterator`."
"typing.Awaitable".msg = "Use `collections.abc.Awaitable`."

# Context managers
"typing.ContextManager".msg = "Use `contextlib.AbstractContextManager`."
"typing.AsyncContextManager".msg = "Use `contextlib.AbstractAsyncContextManager`."

# Python 2 compatibility layers and deprecated stdlib/package APIs.
"six".msg = "Use native Python 3 syntax and stdlib APIs."
"future".msg = "Use native Python 3 syntax and stdlib APIs."
"past".msg = "Use native Python 3 syntax and stdlib APIs."
"mock".msg = "Use `unittest.mock`."
"imp".msg = "Use `importlib`; imp was removed in Python 3.12."
"distutils".msg = "Use `sysconfig`, `packaging`, or the build backend; distutils was removed in Python 3.12."
"pkg_resources".msg = "Use `importlib.metadata`, `importlib.resources`, or `packaging`."
"optparse".msg = "Use `argparse` for command-line parsing."

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
cache_dir = "$MYPY_CONFIG_FILE_DIR/.mypy_cache"
# IMPORTANT: discord launcher collides with `src/app.py`,
# the actual implementation is in `src/discord/src/runtime.py`,
# this file doesn't need type checking.
exclude = ['src/discord/src/app.py']

files = ["src/", "scripts/"]

# -- strict mode --------------------------------------------------------
# Listed individually (instead of strict = true) so per-module relaxations
# below are legible: you can see exactly which flags are being turned off
# and why, rather than guessing which subset of --strict is in play.
disallow_any_generics          = true
disallow_untyped_calls         = true
disallow_untyped_defs          = true
disallow_incomplete_defs       = true
disallow_subclassing_any       = true
check_untyped_defs             = true
disallow_untyped_decorators    = true
warn_redundant_casts           = true
warn_unused_ignores            = true
warn_return_any                = true
no_implicit_reexport           = true
strict_equality                = true
strict_optional                = true
extra_checks                   = true

# -- extra quality flags ------------------------------------------------
warn_unreachable    = true   # dead code after raise / return / assert False
warn_unused_configs = true   # catch stale per-module overrides
# -- output -------------------------------------------------------------
pretty              = true
show_error_codes    = true
show_column_numbers = true
show_error_context  = true

# -- per-module relaxations ---------------------------------------------
# Config's snapshot tuples and mapping signatures differ from MutableMapping.
[[tool.mypy.overrides]]
module = ["config.core", "config.transaction"]
disable_error_code             = ["override"]

# -- pylance compatibility ----------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
include = ["src/", "scripts/"]
exclude = [
    "**/venv/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/node_modules/**",
    "**/.*/**",
    "**/*.egg-info/**"
]
typeCheckingMode = "strict"
reportDeprecated = false
venvPath = "."
venv = "venv"
useLibraryCodeForTypes = false # why the fuck is this on by default

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/config"
# Config's snapshot tuples and mapping signatures differ from MutableMapping
reportIncompatibleMethodOverride = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/db"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/bwatch"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/notify"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/builders"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "src/bots"

[[tool.pyright.executionEnvironments]]
extraPaths = ["src", "src/tests"]
root = "src/tests"
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src", "src/discord/src", "src/discord/src/tests"]
root = "src/discord/src/tests"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src/discord/src", "src"]
root = "src/discord/src"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
extraPaths = ["src"]
root = "scripts"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/discord/src"]
testpaths = ["src/tests", "src/discord/src/tests"]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]
