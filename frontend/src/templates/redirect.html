<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="./common.js"></script>
    <link rel="stylesheet" href="./common.css">
    <title></title>
    <style>
        body { display: grid; place-items: center; padding: 20px; }
        p { max-width: 24rem; padding: 28px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text2); text-align: center; line-height: 1.6; }
        a { color: var(--accent); overflow-wrap: anywhere; }
        a:hover { color: var(--accent-light); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <p><span id="redirect-label"></span><a id="manual-link" href="#"></a>.</p>
