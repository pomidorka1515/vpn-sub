<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
{% include 'shared-bootstrap.html' %}
<script src="{{ prefix }}/common.js?v={{ asset_version }}"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-t="sign_in">Sign in</title>
<link rel="stylesheet" href="{{ prefix }}/common.css?v={{ asset_version }}">
<link rel="stylesheet" href="{{ prefix }}/auth.css?v={{ asset_version }}">
</head>
<body>
<div class="auth-page">
<div class="auth-box">
  <button class="theme-btn" id="themeBtn" data-t-title="toggle_theme"></button>
  <div class="lang-toggle" data-t-aria="lang_selection">
    <button class="lang-btn" data-lang="en" data-t-aria="lang_en">EN</button>
    <button class="lang-btn" data-lang="ru" data-t-aria="lang_ru">RU</button>
  </div>
  <h1 id="authTitle" data-t="sign_in"></h1>
  <div class="auth-tabs">
    <button class="auth-tab active" id="tabLogin" data-t="login"></button>
    <button class="auth-tab" id="tabRegister" data-t="register"></button>
  </div>
  <div class="auth-error" id="authError"></div>

  <div id="loginForm">
    <div class="form-group">
      <label data-t="username"></label>
      <input type="text" id="loginUser" autocomplete="username" spellcheck="false" maxlength="32" pattern="[A-Za-z0-9_\-]+">
    </div>
    <div class="form-group">
      <label data-t="password"></label>
      <div class="pass-wrap">
        <input type="password" id="loginPass" autocomplete="current-password">
        <button class="pass-toggle" data-password="loginPass" type="button" data-t-aria="toggle_password"></button>
      </div>
    </div>
    <button class="btn btn-primary" id="loginBtn" data-t="sign_in"></button>
  </div>

  <div id="registerForm" style="display:none">
    <div class="form-group">
      <label data-t="invite_code"></label>
      <input type="text" id="regCode" spellcheck="false" maxlength="64">
    </div>
    <div class="form-group">
      <label data-t="username"></label>
      <input type="text" id="regUser" autocomplete="off" spellcheck="false" maxlength="32" pattern="[A-Za-z0-9_\-]+">
      <div class="username-hint" id="usernameHint"></div>
    </div>
    <div class="form-group">
      <label data-t="display_name"></label>
      <input type="text" id="regName" autocomplete="off" maxlength="16">
    </div>
    <div class="form-group">
      <label data-t="password"></label>
      <div class="pass-wrap">
        <input type="password" id="regPass" autocomplete="new-password">
        <button class="pass-toggle" data-password="regPass" type="button" data-t-aria="toggle_password"></button>
      </div>
    </div>
    <div class="form-group">
      <label data-t="confirm_password"></label>
      <div class="pass-wrap">
        <input type="password" id="regPass2" autocomplete="new-password">
        <button class="pass-toggle" data-password="regPass2" type="button" data-t-aria="toggle_password"></button>
      </div>
    </div>
    <button class="btn btn-primary" id="regBtn" data-t="create_account"></button>
  </div>
</div>
</div>

<script type="module" src="{{ prefix }}/auth.js?v={{ asset_version }}"></script>
</body>
</html>
