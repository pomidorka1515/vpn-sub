<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ forbidden_title }}</title>
<style>
/* __FONTS__ */
:root {
  --bg: #0a0a0b; --surface: #131316;
  --border: #252529;
  --text: #e4e4e7; --text2: #8e8e96;
  --accent: #6366f1;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; -webkit-font-smoothing: antialiased;
}
.box {
  width: 100%; max-width: 360px; text-align: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 36px 28px;
}
.code {
  font-size: 13px; font-weight: 600; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 10px;
}
h1 {
  font-size: 18px; font-weight: 500; letter-spacing: .3px;
  margin-bottom: 8px;
}
p { font-size: 13px; color: var(--text2); line-height: 1.5; }
</style>
</head>
<body>
<div class="box">
  <div class="code">403</div>
  <h1>{{ use_vpn_client }}</h1>
  <p>{{ use_vpn_client_hint }}</p>
</div>
</body>
</html>
