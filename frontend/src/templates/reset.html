<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
{% include 'shared-bootstrap.html' %}
<script src="{{ prefix }}/common.js?v={{ asset_version }}"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title data-t="reset_password">{{ L['reset_password'] }}</title>
<link rel="stylesheet" href="{{ prefix }}/common.css?v={{ asset_version }}">
<link rel="stylesheet" href="{{ prefix }}/auth.css?v={{ asset_version }}">
</head>
<body>
<div class="auth-page">
<div class="auth-box">
  <button class="theme-btn" id="themeBtn" data-t-title="toggle_theme"></button>
  <div class="lang-toggle" data-t-aria="lang_selection">
    <button class="lang-btn" data-lang="en" data-t-aria="lang_en" data-t="language_en">{{ L['language_en'] }}</button>
    <button class="lang-btn" data-lang="ru" data-t-aria="lang_ru" data-t="language_ru">{{ L['language_ru'] }}</button>
  </div>
  <h1 data-t="reset_password">{{ L['reset_password'] }}</h1>
  <div class="auth-error" id="authError" role="alert"></div>
  <form id="resetForm">
    <div class="form-group">
      <label for="resetPass" data-t="password">{{ L['password'] }}</label>
      <div class="pass-wrap">
        <input type="password" id="resetPass" autocomplete="new-password" required minlength="1" maxlength="128">
        <button class="pass-toggle" data-password="resetPass" type="button" data-t-aria="toggle_password"></button>
      </div>
    </div>
    <div class="form-group">
      <label for="resetPass2" data-t="confirm_password">{{ L['confirm_password'] }}</label>
      <div class="pass-wrap">
        <input type="password" id="resetPass2" autocomplete="new-password" required minlength="1" maxlength="128">
        <button class="pass-toggle" data-password="resetPass2" type="button" data-t-aria="toggle_password"></button>
      </div>
    </div>
    <button class="btn btn-primary" id="resetBtn" type="submit" data-t="reset_password">{{ L['reset_password'] }}</button>
  </form>
  <div id="resetSuccess" hidden role="status">
    <p data-t="password_reset_success">{{ L['password_reset_success'] }}</p>
    <a class="btn btn-primary" href="{{ prefix }}/auth" data-t="sign_in">{{ L['sign_in'] }}</a>
  </div>
</div>
</div>
<script type="module" src="{{ prefix }}/reset.js?v={{ asset_version }}"></script>
</body>
</html>
