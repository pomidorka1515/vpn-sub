<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>404 · Page not found</title>
<script>
  // Apply the saved theme before the first paint, even on an unknown route.
  try {
    if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
  } catch (_) {}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    --bg: #0a0a0b; --box: #050506; --border: #252529;
    --text: #e4e4e7; --muted: #8e8e96; --accent: #6366f1;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #fff; --box: #f4f4f5; --border: #e4e4e7;
    --text: #18181b; --muted: #3f3f46;
  }
  :root { font-size: 100%; }
  @media (min-width: 1024px) {
    :root { font-size: 112.5%; }
  }
  body {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 23.75rem; text-align: center;
    background: var(--box); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 32px;
  }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
  }
  h1 { font-size: clamp(20px, 5vw, 24px); font-weight: 500; letter-spacing: -.3px; line-height: 1.25; }
  p { margin: 14px auto 28px; max-width: 310px; color: var(--muted); font-size: 14px; line-height: 1.7; text-wrap: pretty; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    min-height: 44px; padding: 11px 22px; border: 1px solid transparent; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background .2s;
  }
  button:hover { background: #4f46e5; }
  button[hidden] { display: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  button svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1 id="heading">Page not found</h1>
  <p id="description">This page may have moved, or the link is incorrect. Check the address and try again.</p>
  <button type="button" id="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
    <span id="backLabel">Go back</span>
  </button>
</main>
<script>
  (() => {
    const supported = value => value === 'en' || value === 'ru';
    let lang;
    try {
      lang = [localStorage.getItem('lang'), localStorage.getItem('admin_lang')].find(supported);
    } catch (_) {}
    if (!lang) lang = (navigator.languages || [navigator.language]).map(value => value.split('-')[0].toLowerCase()).find(supported) || 'en';
    document.documentElement.lang = lang;
    if (lang === 'ru') {
      document.title = '404 · Страница не найдена';
      document.getElementById('heading').textContent = 'Страница не найдена';
      document.getElementById('description').textContent = 'Возможно, страница переехала или в ссылке ошибка. Проверьте адрес и попробуйте снова.';
      document.getElementById('backLabel').textContent = 'Вернуться назад';
    }
    const back = document.getElementById('back');
    if (history.length > 1) back.addEventListener('click', () => history.back());
    else back.hidden = true;
  })();
</script>
</body>
</html>
