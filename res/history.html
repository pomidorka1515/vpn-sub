<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<script src="{{ prefix }}/common.js?v={{ asset_version }}"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-t="page_title">History</title>
<link rel="stylesheet" href="{{ prefix }}/common.css?v={{ asset_version }}">
<link rel="stylesheet" href="{{ prefix }}/history.css?v={{ asset_version }}">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="btn-back" onclick="goBack()" id="btnBack" data-t-aria="back_aria">
      <span class="arrow" aria-hidden="true">←</span><span id="btnBackText" data-t="back"></span>
    </button>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" data-t-title="toggle_theme"></button>
    <div class="lang-toggle" role="group" data-t-aria="lang_selection">
      <button class="lang-btn" data-lang="en" onclick="setLang('en')" data-t-aria="lang_en">EN</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')" data-t-aria="lang_ru">RU</button>
    </div>
    <button class="btn-sm" onclick="loadHistory()" id="btnRefresh" data-t="refresh" data-t-aria="refresh_aria"></button>
  </div>
</div>

<div class="dash-content">
  <h1 class="page-title" data-t="page_title"></h1>

  <div class="card">
    <div class="card-title" data-t="range" style="margin-bottom:14px"></div>
    <div class="range-row">
      <input type="range" class="range-input" id="daysRange" min="1" max="90" value="30">
      <div class="range-value">
        <span class="num" id="daysValue">30</span>
        <span class="suffix" data-t="days_suffix"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-title" data-t="regular_traffic"></div>
      <div class="card-sub" id="regSummary">—</div>
    </div>
    <div class="chart-wrap" id="regWrap">
      <canvas id="regChart"></canvas>
    </div>
    <div class="chart-empty" id="regEmpty" style="display:none"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-title" data-t="wl_traffic"></div>
      <div class="card-sub wl" id="wlSummary">—</div>
    </div>
    <div class="chart-wrap" id="wlWrap">
      <canvas id="wlChart"></canvas>
    </div>
    <div class="chart-empty" id="wlEmpty" style="display:none"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" onerror="handleChartJsError()"></script>
<script>
window.BASE = '{{ prefix }}';
window.API = window.BASE + '/webapi';
window.AUTH_PAGE = window.BASE + '/auth';
window.DASHBOARD_PAGE = window.BASE + '/panel';
window.DEBOUNCE_MS = 1000;
window.LANG = {{ L | tojson }};
window.LANG_EN = {{ L_en | tojson }};
window.LANG_CODE = '{{ lang }}';
window.lang = window.LANG_CODE;
</script>
<script src="{{ prefix }}/history.js?v={{ asset_version }}"></script>
</body>
</html>
