<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<script src="{{ prefix }}/common.js?v={{ asset_version }}"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-t="sign_in">Sign in</title>
<link rel="stylesheet" href="{{ prefix }}/common.css?v={{ asset_version }}">
<link rel="stylesheet" href="{{ prefix }}/auth.css?v={{ asset_version }}">
</head>
<body>
<div class="auth-page">
<div class="auth-box">
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" data-t-title="toggle_theme"></button>
  <div class="lang-toggle" data-t-aria="lang_selection">
    <button class="lang-btn" data-lang="en" onclick="setLang('en')" data-t-aria="lang_en">EN</button>
    <button class="lang-btn" data-lang="ru" onclick="setLang('ru')" data-t-aria="lang_ru">RU</button>
  </div>
  <h1 id="authTitle" data-t="sign_in"></h1>
  <div class="auth-error" id="authError"></div>

  <div id="loginForm">
    <div class="form-group">
      <label data-t="username"></label>
      <input type="text" id="loginUser" autocomplete="username" spellcheck="false" maxlength="128">
    </div>
    <div class="form-group">
      <label data-t="password"></label>
      <div class="pass-wrap">
        <input type="password" id="loginPass" autocomplete="current-password">
        <button class="pass-toggle" onclick="togglePass('loginPass', this)" type="button" data-t-aria="toggle_password"></button>
      </div>
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()" data-t="sign_in"></button>
  </div>
</div>
</div>

<script>
const BASE = '{{ prefix }}';
const PANEL = BASE + '/admin';
const SESSION = PANEL + '/session';
window.LANG = {{ L | tojson }};
window.LANG_EN = {{ L_en | tojson }};
window.LANG_CODE = '{{ lang }}';
window.lang = window.LANG_CODE;

function render() {
  applyStaticLang();
  document.getElementById('authTitle').textContent = t('sign_in');
  document.title = document.getElementById('authTitle').textContent;
}

window.apiConfig = { baseUrl: PANEL };

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg; el.classList.add('show');
}

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try {
    const res = await fetch(SESSION, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value
      })
    });
    const data = await res.json().catch(() => null);
    if (res.ok && data && data.success) window.location.href = PANEL;
    else showError((data && data.msg) || t('invalid_credentials'));
  } catch { showError(t('network_err')); }
  btn.disabled = false;
}

(async () => {
  try {
    const r = await fetch(PANEL + '/token', { credentials: 'same-origin' });
    const data = await r.json().catch(() => null);
    if (r.ok && data && data.success && data.obj && data.obj.token) window.location.href = PANEL;
  } catch {}
})();

applyTheme();
initPassToggles();
initLang();
render();
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
