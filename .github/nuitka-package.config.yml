# Quart imports its shell CLI and test helpers during normal initialization.
# Keep those modules importable without bundling interactive Python/debuggers.
- module-name: 'quart.cli'
  anti-bloat:
    - description: 'remove unused Quart interactive shell dependency'
      replacements_plain:
        'import code': 'code = None'

- module-name: 'click.testing'
  anti-bloat:
    - description: 'remove unused Click test runner debugger dependency'
      replacements_plain:
        'import pdb': 'pdb = None'

# The binary uses programmatic asyncio serving with ServerLogger and TCP binds.
# Remove eager optional imports before excluding their modules from the payload.
- module-name: 'hypercorn.asyncio.run'
  anti-bloat:
    - description: 'remove unused Hypercorn QUIC and StatsD dependencies'
      replacements_plain:
        'from .udp_server import UDPServer': 'UDPServer = None'
        'from .statsd import StatsdLogger': 'StatsdLogger = None'
        'config.set_statsd_logger_class(StatsdLogger)': 'pass'
        'for sock in sockets.quic_sockets:': 'for sock in ():'

- module-name: 'qrcode.main'
  anti-bloat:
    - description: 'use required Pillow instead of optional PyPNG fallback'
      replacements_plain:
        'from qrcode.image.pure import PyPNGImage': 'PyPNGImage = None'
        'image_factory = PilImage if Image else PyPNGImage': 'image_factory = PilImage'

# The binary serves asynchronously through Hypercorn and never starts Werkzeug's
# development server. Werkzeug, Flask's app and its CLI re-export/import the
# dev-server helpers eagerly, so neutralize those imports before excluding
# werkzeug.serving. `is_running_from_reloader` is only consulted inside the
# never-called Flask.run(), hence the constant stub.
- module-name: 'werkzeug'
  anti-bloat:
    - description: 'remove eager werkzeug.serving re-export'
      replacements_plain:
        'from .serving import run_simple as run_simple': 'run_simple = None'

- module-name: 'flask.app'
  anti-bloat:
    - description: 'remove eager werkzeug.serving reloader helper import'
      replacements_plain:
        'from werkzeug.serving import is_running_from_reloader': 'is_running_from_reloader = lambda: False'

- module-name: 'flask.cli'
  anti-bloat:
    - description: 'remove eager werkzeug.serving reloader helper import'
      replacements_plain:
        'from werkzeug.serving import is_running_from_reloader': 'is_running_from_reloader = lambda: False'

# Application data does not use Decimal values.
- module-name: 'flask.json.provider'
  anti-bloat:
    - description: 'remove unused decimal dependency'
      replacements_plain:
        'import decimal': ''

- module-name: 'werkzeug.sansio.response'
  anti-bloat:
    - description: 'remove unused decimal dependency'
      replacements_plain:
        'import decimal': ''

- module-name: 'PIL.ImageOps'
  anti-bloat:
    - description: 'remove unused decimal dependency'
      replacements_plain:
        'import decimal': ''

# The gateway uses discord.utils' active decompressor; retain only zlib-stream.
- module-name: 'discord.utils'
  anti-bloat:
    - description: 'force zlib gateway compression instead of optional zstd'
      replacements_plain:
        'from zstandard import ZstdDecompressor': 'raise ImportError'
        'from compression.zstd import ZstdDecompressor': 'raise ImportError'

# Panel responses are UTF-8 JSON; Requests already falls back to UTF-8 when
# no detector is available. Keep its other dependency compatibility checks.
- module-name: 'requests'
  anti-bloat:
    - description: 'remove optional charset detector imports and missing-detector warning'
      replacements_plain:
        'from charset_normalizer import __version__ as charset_normalizer_version': 'raise ImportError'
        'from chardet import __version__ as chardet_version': 'raise ImportError'
        ? |-
          warnings.warn(
                      "Unable to find acceptable character detection dependency "
                      "(chardet or charset_normalizer).",
                      RequestsDependencyWarning,
                  )
        : 'pass'

- module-name: 'requests.compat'
  anti-bloat:
    - description: 'use UTF-8 fallback instead of optional charset detection'
      replacements_plain:
        'chardet = _resolve_char_detection()': 'chardet = None'
