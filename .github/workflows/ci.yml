name: ci

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ["pytest", "mypy", "pyright", "ruff check ."]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: install
        run: pip install -e ".[dev]"

      - name: "run ${{ matrix.command }}"
        run: "${{ matrix.command }}"
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
