name: ci

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest

      - name: mypy
        run: mypy

      - name: pyright
        run: pyright
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: 1
