name: ci

on:
  push:
    branches: [main]

env:
  UV_PROJECT_ENVIRONMENT: venv

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:build

  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ["pytest", "mypy", "pyright", "ruff check ."]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.10"
          python-version: "3.14"
          enable-cache: true

      - name: install
        run: uv sync --locked

      - uses: actions/setup-node@v5
        if: matrix.command == 'pytest'
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: build runtime resources
        if: matrix.command == 'pytest'
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: "run ${{ matrix.command }}"
        run: "uv run --locked ${{ matrix.command }}"
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"

      - name: flatten release sources
        if: matrix.command == 'pytest'
        run: |
          PYTHONPATH=src uv run --locked python -m obfuscator src build/release-src
          uv run --locked python -m py_compile build/release-src/app.min.py

      - name: checkout lifecycle smoke
        if: matrix.command == 'pytest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          uv run --locked python scripts/smoke_async_release.py --checkout
