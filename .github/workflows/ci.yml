name: ci

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ["pytest", "mypy", "pyright", "ruff check ."]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: install
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        if: matrix.command == 'pytest'
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: build runtime resources
        if: matrix.command == 'pytest'
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: "run ${{ matrix.command }}"
        run: "${{ matrix.command }}"
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"

      - name: checkout lifecycle smoke
        if: matrix.command == 'pytest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          python scripts/smoke_async_release.py --checkout
