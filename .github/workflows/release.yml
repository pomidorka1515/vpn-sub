name: release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vpn-sub
            pythonpath: src
            entry: src/main.py
            extra: >-
              --include-module=asgi
              --include-module=hypercorn.asyncio
              --include-package=quart
              --include-module=telebot.async_telebot
              --include-module=telebot.asyncio_helper
              --include-module=aiohttp
              --include-package=aiosqlite
              --include-module=redis.asyncio
              --include-module=paths
              --include-module=version
              --include-package=cli
              --include-data-dir=res=res
              --include-data-files=lang.jsonc=lang.jsonc
              --include-data-files=config.schema.json=config.schema.json
              --include-module=discord
              --include-package=bots.discord
              --include-data-files=src/discord/lang.jsonc=discord.lang.jsonc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: require a normal CPython
        run: |
          python -c 'import sys; raise SystemExit(0 if sys.abiflags == "" else f"refusing free-threading build: sys.abiflags={sys.abiflags!r}")'
          python -c 'import sys; print(sys.version)'
          getconf GNU_LIBC_VERSION

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache patchelf redis-server \
            zlib1g-dev libfreetype6-dev libraqm-dev

      - name: restore ccache
        # Actions caches are tag-scoped; artifacts can be read across tag runs.
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ARTIFACT: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
        run: |
          mkdir -p "$HOME/.cache/ccache"
          artifact_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$CACHE_ARTIFACT" -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No previous ccache artifact; starting with an empty cache"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/ccache.zip"
          python - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          temporary = Path(sys.argv[1])
          with ZipFile(temporary / "ccache.zip") as archive:
              (temporary / "ccache.tar").write_bytes(archive.read("ccache.tar"))
          PY
          tar -xf "$RUNNER_TEMP/ccache.tar" -C "$HOME/.cache/ccache"
          echo "Restored ccache artifact $artifact_id"

      - name: install runtime dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'nuitka>=4,<5' ordered-set zstandard
          python -m pip install -r requirements.txt

      - name: build PNG-only Pillow
        run: |
          # Import exclusions cannot remove codecs linked into the Pillow wheel.
          # Rebuild the installed version, preserving PNG and font/text layout.
          # Avoid pip's cached full-featured wheel, including across tag builds.
          pillow_version="$(python -c 'import PIL; print(PIL.__version__)')"
          CFLAGS="-O2 -g0" python -m pip install --force-reinstall --no-deps \
            --no-cache-dir --no-binary=pillow "Pillow==${pillow_version}" \
            -C zlib=enable -C freetype=enable -C raqm=enable \
            -C jpeg=disable -C tiff=disable -C jpeg2000=disable \
            -C webp=disable -C avif=disable -C lcms=disable \
            -C imagequant=disable -C xcb=disable
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import sys

          import qrcode
          from PIL import Image, ImageDraw, ImageFont, features

          # Simulate the runtime exclusions while keeping zstd for build tools.
          sys.modules["zstandard"] = None
          sys.modules["compression.zstd"] = None
          import discord.utils
          if discord.utils._ActiveDecompressionContext.COMPRESSION_TYPE != "zlib-stream":
              raise SystemExit("Discord did not select zlib gateway compression")

          for feature in ("zlib", "freetype2", "raqm"):
              if not features.check(feature):
                  raise SystemExit(f"Pillow is missing required feature: {feature}")
          for feature in ("jpg", "libtiff", "jpg_2000", "webp", "avif", "littlecms2", "libimagequant", "xcb"):
              if features.check(feature):
                  raise SystemExit(f"Pillow retained unwanted feature: {feature}")
          image = Image.new("RGB", (240, 80), "white")
          font = ImageFont.truetype(str(next(Path("res/fonts").glob("*.ttf"))), 16)
          ImageDraw.Draw(image).text((5, 5), "VPN тест", font=font, fill="black")
          for image in (image, qrcode.make("https://example.com/sub")):
              buffer = BytesIO()
              image.save(buffer, format="PNG")
              buffer.seek(0)
              with Image.open(buffer, formats=["PNG"]) as decoded:
                  decoded.load()
          PY

      - name: strip runtime extension debug symbols
        run: |
          # Nuitka strips its executable, but copies extension modules with
          # their debug symbols intact. Strip these before onefile compression.
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import subprocess
          import sysconfig
          import tempfile

          roots = {
              Path(sysconfig.get_config_var("DESTSHARED")),
              Path(sysconfig.get_path("platlib")),
          }
          saved = 0
          count = 0
          for root in sorted(roots):
              for path in sorted(root.rglob("*.so")):
                  if path.is_symlink():
                      continue
                  with path.open("rb") as stream:
                      if stream.read(4) != b"\x7fELF":
                          continue
                  before = path.stat().st_size
                  # Some stdlib extensions are already mapped into this Python
                  # process. In-place stripping rewrites their backing inode
                  # and can segfault it. Replace with a stripped copy instead;
                  # existing mappings retain the original inode until exit.
                  with tempfile.TemporaryDirectory(dir=path.parent) as temporary:
                      stripped = Path(temporary) / path.name
                      shutil.copy2(path, stripped)
                      subprocess.run(["strip", "--strip-unneeded", str(stripped)], check=True)
                      os.replace(stripped, path)
                  saved += before - path.stat().st_size
                  count += 1
          print(f"Stripped {count} extension modules; removed {saved:,} bytes")
          PY

      - name: patch nuitka onefile compression
        run: |
          python - <<'PY'
          """Force single-threaded onefile compression.

          CPython 3.14's compression.zstd rejects nb_workers outside [0, 0].
          Nuitka still passes the job limit (4 on these runners), which crashes
          attachOnefilePayload before the binary is packed.
          """
          import pathlib
          import nuitka.tools.onefile_compressor.OnefileCompressor as compressor

          path = pathlib.Path(compressor.__file__)
          source = path.read_text()
          old = "effective_threads = 0 if low_memory or is32BitPython() else job_limit"
          new = "effective_threads = 0  # CPython 3.14 stdlib zstd: nb_workers must be 0"
          if new in source:
              raise SystemExit(0)
          if old not in source:
              raise SystemExit(f"nuitka compressor patch missed its target in {path}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: patch nuitka early-import codecs
        run: |
          python - <<'PY'
          """Keep Nuitka from force-importing CJK/legacy multibyte codecs.

          Nuitka probes every `encodings.<name>` and marks whatever the probe
          pulls in as "Technically required for CPython library startup", which
          no --nofollow-import-to can override. The CJK and ISO-2022 probes drag
          in _codecs_{cn,hk,jp,kr,tw,iso2022} and _multibytecodec, roughly 0.9MB
          uncompressed that this ru/en service can never reach. Drop them from
          the probe; the workflow's nofollow list keeps them out afterwards.
          """
          import pathlib

          import nuitka.freezer.ImportDetection as detection

          path = pathlib.Path(detection.__file__)
          source = path.read_text()
          marker = "vpn-sub: drop CJK/legacy codecs from early imports."
          if marker in source:
              raise SystemExit(0)
          old = (
              "    encoding_names = [\n"
              '        m[1] for m in pkgutil.iter_modules(sys.modules["encodings"].__path__)\n'
              "    ]\n"
          )
          new = old + (
              "\n"
              "    # vpn-sub: drop CJK/legacy codecs from early imports. They pull in\n"
              "    # _codecs_{cn,hk,jp,kr,tw,iso2022} and _multibytecodec instead.\n"
              "    for _dropped_encoding in (\n"
              '        "big5", "big5hkscs", "cp932", "cp949", "cp950",\n'
              '        "euc_jis_2004", "euc_jisx0213", "euc_jp", "euc_kr",\n'
              '        "gb2312", "gbk", "gb18030", "hz",\n'
              '        "iso2022_jp", "iso2022_jp_1", "iso2022_jp_2", "iso2022_jp_2004",\n'
              '        "iso2022_jp_3", "iso2022_jp_ext", "iso2022_kr", "johab",\n'
              '        "shift_jis", "shift_jis_2004", "shift_jisx0213",\n'
              "    ):\n"
              "        if _dropped_encoding in encoding_names:\n"
              "            encoding_names.remove(_dropped_encoding)\n"
          )
          if old not in source:
              raise SystemExit(f"nuitka early-import patch missed its target in {path}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: build ${{ matrix.name }}
        env:
          # Must be an existing file. Nuitka does os.path.exists() on this
          # value and does not search PATH, so a bare "ccache" is ignored
          # and the compiler runs uncached.
          NUITKA_CCACHE_BINARY: /usr/bin/ccache
        run: |
          # The artifact restores to ~/.cache/ccache. Nuitka honors
          # CCACHE_DIR only when it is already in the environment; otherwise
          # it stores objects under its own cache and the restore is unused.
          mkdir -p "$HOME/.cache/ccache"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --set-config=max_size=2G
          ccache --zero-stats
          # GitHub ubuntu-22.04 runners are 2 vCPU. Nuitka's default job count
          # oversubscribes them once --lto=yes is linking.
          jobs="$(nproc)"
          version="${GITHUB_REF_NAME#v}"
          # Nuitka product metadata accepts only numbers; runtime/tag identity
          # and the unpack cache retain the complete prerelease/build suffix.
          product_version="${version%%+*}"
          product_version="${product_version%%-*}"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("src/version.py")
          source = path.read_text()
          old = 'VERSION = "0.0.0"'
          new = f'VERSION = {os.environ["GITHUB_REF_NAME"].removeprefix("v")!r}'
          if old not in source:
              raise SystemExit(f"src/version.py has no {old} placeholder")
          path.write_text(source.replace(old, new, 1))
          PY
          export CCFLAGS="-Os -fno-plt -fdata-sections -ffunction-sections"
          export LDFLAGS="-Wl,--gc-sections -Wl,-O2 -Wl,--as-needed -Wl,--strip-all"
          # Audit reports exposed bundled aiosqlite tests and unused Pillow formats.
          # Keep quart.testing (imported by quart.app), click.testing (used by
          # quart.testing), werkzeug.test (exported by werkzeug), and jinja2.tests
          # (template predicates). Charts/QR codes need only PNG and fonts.
          # Discord's own __init__ imports voice support; follow those imports,
          # but do not force in unused discord.ext commands/tasks.
          # The package config removes eager shell/debugger imports in Quart
          # and Click before excluding their unused interactive dependencies.
          # Only Hypercorn's asyncio TCP server is used; omit its CLI, middleware,
          # StatsD logging and optional HTTP/3/QUIC UDP stack.
          # Werkzeug's dev server is re-exported eagerly by werkzeug/flask; the
          # package config neutralizes those imports so it can be excluded too.
          # Stdlib e-mail/archive/URL chains are only reached through lazy
          # importers (logging.handlers, shutil, urllib.request, click), the
          # unused concurrent process-pool modules are never imported eagerly,
          # and the C decimal accelerator has a bundled pure-Python fallback.
          # The CJK codecs are dropped from Nuitka's early-import probe by the
          # patch step above, then kept out with the nofollow entries below.
          PYTHONPATH=${{ matrix.pythonpath }} python -m nuitka \
            --onefile \
            --onefile-tempdir-spec="{CACHE_DIR}/${{ matrix.name }}/${version}/{PID}_{TIME_US}_{RANDOM}" \
            --onefile-child-grace-time=infinity \
            --product-version="${product_version}" \
            --deployment \
            --lto=yes \
            --jobs="${jobs}" \
            --static-libpython=yes \
            --python-flag=no_docstrings \
            --python-flag=no_asserts \
            --python-flag=no_site \
            --python-flag=isolated \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-pytest-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --noinclude-IPython-mode=nofollow \
            --noinclude-pydoc-mode=nofollow \
            --user-package-configuration-file=.github/nuitka-package.config.yml \
            --noinclude-custom-mode=telebot:bytecode \
