name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vpn-sub
            pythonpath: src
            entry: src/main.py
            extra: >-
              --include-module=asgi
              --include-package=hypercorn
              --include-package=quart
              --include-module=telebot.async_telebot
              --include-module=telebot.asyncio_helper
              --include-module=aiohttp
              --include-package=aiosqlite
              --include-module=redis.asyncio
              --include-module=paths
              --include-module=version
              --include-package=cli
              --include-data-dir=res=res
              --include-data-files=lang.jsonc=lang.jsonc
              --include-data-files=config.schema.json=config.schema.json
              --include-package=discord
              --include-package=bots.discord
              --include-data-files=src/discord/lang.jsonc=discord.lang.jsonc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: require a normal CPython
        run: |
          python -c 'import sys; raise SystemExit(0 if sys.abiflags == "" else f"refusing free-threading build: sys.abiflags={sys.abiflags!r}")'
          python -c 'import sys; print(sys.version)'
          getconf GNU_LIBC_VERSION

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache patchelf redis-server \
            zlib1g-dev libfreetype6-dev libraqm-dev

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-

      - name: install runtime dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'nuitka>=4,<5' ordered-set zstandard
          python -m pip install -r requirements.txt

      - name: build PNG-only Pillow
        run: |
          # Import exclusions cannot remove codecs linked into the Pillow wheel.
          # Rebuild the installed version, preserving PNG and font/text layout.
          # Avoid pip's cached full-featured wheel, including across tag builds.
          pillow_version="$(python -c 'import PIL; print(PIL.__version__)')"
          CFLAGS="-O2 -g0" python -m pip install --force-reinstall --no-deps \
            --no-cache-dir --no-binary=pillow "Pillow==${pillow_version}" \
            -C zlib=enable -C freetype=enable -C raqm=enable \
            -C jpeg=disable -C tiff=disable -C jpeg2000=disable \
            -C webp=disable -C avif=disable -C lcms=disable \
            -C imagequant=disable -C xcb=disable
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import sys

          import qrcode
          from PIL import Image, ImageDraw, ImageFont, features

          # Simulate the Nuitka exclusion while keeping zstandard installed for
          # the build tools. Fail early if this Python lacks stdlib zstd support.
          import compression.zstd
          sys.modules["zstandard"] = None
          import discord.utils
          if discord.utils._ZSTD_SOURCE != "compression.zstd":
              raise SystemExit("Discord did not select stdlib zstd")

          for feature in ("zlib", "freetype2", "raqm"):
              if not features.check(feature):
                  raise SystemExit(f"Pillow is missing required feature: {feature}")
          for feature in ("jpg", "libtiff", "jpg_2000", "webp", "avif", "littlecms2", "libimagequant", "xcb"):
              if features.check(feature):
                  raise SystemExit(f"Pillow retained unwanted feature: {feature}")
          image = Image.new("RGB", (240, 80), "white")
          font = ImageFont.truetype(str(next(Path("res/fonts").glob("*.ttf"))), 16)
          ImageDraw.Draw(image).text((5, 5), "VPN тест", font=font, fill="black")
          for image in (image, qrcode.make("https://example.com/sub")):
              buffer = BytesIO()
              image.save(buffer, format="PNG")
              buffer.seek(0)
              with Image.open(buffer, formats=["PNG"]) as decoded:
                  decoded.load()
          PY

      - name: patch nuitka onefile compression
        run: |
          python - <<'PY'
          """Force single-threaded onefile compression.

          CPython 3.14's compression.zstd rejects nb_workers outside [0, 0].
          Nuitka still passes the job limit (4 on these runners), which crashes
          attachOnefilePayload before the binary is packed.
          """
          import pathlib
          import nuitka.tools.onefile_compressor.OnefileCompressor as compressor

          path = pathlib.Path(compressor.__file__)
          source = path.read_text()
          old = "effective_threads = 0 if low_memory or is32BitPython() else job_limit"
          new = "effective_threads = 0  # CPython 3.14 stdlib zstd: nb_workers must be 0"
          if new in source:
              raise SystemExit(0)
          if old not in source:
              raise SystemExit(f"nuitka compressor patch missed its target in {path}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: build ${{ matrix.name }}
        env:
          # Must be an existing file. Nuitka does os.path.exists() on this
          # value and does not search PATH, so a bare "ccache" is ignored
          # and the compiler runs uncached.
          NUITKA_CCACHE_BINARY: /usr/bin/ccache
        run: |
          # actions/cache restores to ~/.cache/ccache. Nuitka honors
          # CCACHE_DIR only when it is already in the environment; otherwise
          # it stores objects under its own cache and the restore is unused.
          mkdir -p "$HOME/.cache/ccache"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --set-config=max_size=2G
          ccache --zero-stats
          # GitHub ubuntu-22.04 runners are 2 vCPU. Nuitka's default job count
          # oversubscribes them once --lto=yes is linking.
          jobs="$(nproc)"
          version="${GITHUB_REF_NAME#v}"
          # Nuitka product metadata accepts only numbers; runtime/tag identity
          # and the unpack cache retain the complete prerelease/build suffix.
          product_version="${version%%+*}"
          product_version="${product_version%%-*}"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("src/version.py")
          source = path.read_text()
          old = 'VERSION = "0.0.0"'
          new = f'VERSION = {os.environ["GITHUB_REF_NAME"].removeprefix("v")!r}'
          if old not in source:
              raise SystemExit(f"src/version.py has no {old} placeholder")
          path.write_text(source.replace(old, new, 1))
          PY
          export CCFLAGS="${CCFLAGS:--O3 -fno-plt -fdata-sections -ffunction-sections}"
          export LDFLAGS="${LDFLAGS:--Wl,--gc-sections -Wl,-O1 -Wl,--as-needed}"
          # Audit reports exposed bundled aiosqlite tests and unused Pillow formats.
          # Keep quart.testing (imported by quart.app), click.testing (used by
          # quart.testing), werkzeug.test (exported by werkzeug), and jinja2.tests
          # (template predicates). Charts/QR codes need only PNG and fonts.
          PYTHONPATH=${{ matrix.pythonpath }} python -m nuitka \
            --onefile \
            --onefile-tempdir-spec="{CACHE_DIR}/${{ matrix.name }}/${version}/{PID}_{TIME_US}_{RANDOM}" \
            --onefile-child-grace-time=infinity \
            --product-version="${product_version}" \
            --deployment \
            --lto=yes \
            --jobs="${jobs}" \
            --static-libpython=yes \
            --python-flag=no_docstrings \
            --python-flag=no_site \
            --python-flag=isolated \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-pytest-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --noinclude-IPython-mode=nofollow \
            --noinclude-pydoc-mode=nofollow \
            --noinclude-custom-mode=telebot:bytecode \
            --noinclude-custom-mode=redis:bytecode \
            --noinclude-custom-mode=discord:bytecode \
            --noinclude-custom-mode=psutil:bytecode \
            --noinclude-custom-mode=flask:bytecode \
            --noinclude-custom-mode=quart:bytecode \
            --noinclude-custom-mode=werkzeug:bytecode \
            --noinclude-custom-mode=jinja2:bytecode \
            --noinclude-custom-mode=hypercorn:bytecode \
            --noinclude-custom-mode=h11:bytecode \
            --noinclude-custom-mode=h2:bytecode \
            --noinclude-custom-mode=hpack:bytecode \
            --noinclude-custom-mode=hyperframe:bytecode \
            --noinclude-custom-mode=aiohttp:bytecode \
            --noinclude-custom-mode=requests:bytecode \
            --noinclude-custom-mode=urllib3:bytecode \
            --noinclude-custom-mode=PIL:bytecode \
            --noinclude-custom-mode=qrcode:bytecode \
            --noinclude-custom-mode=jsonschema:bytecode \
            --noinclude-custom-mode=referencing:bytecode \
            --nofollow-import-to=doctest \
            --nofollow-import-to=pydoc_data \
            --nofollow-import-to=idlelib \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=turtle \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=lib2to3 \
            --nofollow-import-to=psutil._pswindows \
            --nofollow-import-to=psutil._psosx \
            --nofollow-import-to=psutil._psbsd \
            --nofollow-import-to=psutil._pssunos \
            --nofollow-import-to=psutil._psaix \
            --nofollow-import-to=hypercorn.trio \
            --nofollow-import-to=trio \
            --nofollow-import-to=zstandard \
            --output-filename=${{ matrix.name }} \
            --output-dir=build/dist \
            --report=build/dist/${{ matrix.name }}-report.xml \
            --nofollow-import-to=tests \
            --nofollow-import-to=pytest \
            --nofollow-import-to=unittest \
            --nofollow-import-to=_pytest \
            --nofollow-import-to=py \
            --nofollow-import-to='aiosqlite.tests*' \
            --nofollow-import-to=redis.commands.timeseries \
            --nofollow-import-to=redis.commands.search \
            --nofollow-import-to=redis.commands.vectorset \
            --nofollow-import-to=redis.commands.bf \
            --nofollow-import-to=redis.commands.json \
            --nofollow-import-to=flask.testing \
            --nofollow-import-to=__hello__ \
            --nofollow-import-to='__phello__*' \
            --nofollow-import-to=PIL.ImageQt \
            --nofollow-import-to=PIL.ImageTk \
            --nofollow-import-to=PIL.ImageShow \
            --nofollow-import-to=PIL.ImageGrab \
            --nofollow-import-to=PIL.ImageWin \
            --nofollow-import-to=PIL.ImageCms \
            --nofollow-import-to=PIL.JpegImagePlugin \
            --nofollow-import-to=PIL.TiffImagePlugin \
            --nofollow-import-to=PIL.SpiderImagePlugin \
            --nofollow-import-to=PIL.DdsImagePlugin \
            --nofollow-import-to=PIL.BlpImagePlugin \
            --nofollow-import-to=PIL.BmpImagePlugin \
            --nofollow-import-to=PIL.PpmImagePlugin \
            --nofollow-import-to=PIL.ImImagePlugin \
            --nofollow-import-to=PIL.PsdImagePlugin \
            --nofollow-import-to=PIL.AvifImagePlugin \
            --nofollow-import-to=PIL.WebPImagePlugin \
            --nofollow-import-to=PIL.GifImagePlugin \
            --nofollow-import-to=PIL.BufrStubImagePlugin \
            --nofollow-import-to=PIL.CurImagePlugin \
            --nofollow-import-to=PIL.DcxImagePlugin \
            --nofollow-import-to=PIL.EpsImagePlugin \
            --nofollow-import-to=PIL.FitsImagePlugin \
            --nofollow-import-to=PIL.FliImagePlugin \
            --nofollow-import-to=PIL.FpxImagePlugin \
            --nofollow-import-to=PIL.FtexImagePlugin \
            --nofollow-import-to=PIL.GbrImagePlugin \
            --nofollow-import-to=PIL.GribStubImagePlugin \
            --nofollow-import-to=PIL.Hdf5StubImagePlugin \
            --nofollow-import-to=PIL.IcnsImagePlugin \
            --nofollow-import-to=PIL.IcoImagePlugin \
            --nofollow-import-to=PIL.ImtImagePlugin \
            --nofollow-import-to=PIL.IptcImagePlugin \
            --nofollow-import-to=PIL.Jpeg2KImagePlugin \
            --nofollow-import-to=PIL.McIdasImagePlugin \
            --nofollow-import-to=PIL.MicImagePlugin \
            --nofollow-import-to=PIL.MpegImagePlugin \
            --nofollow-import-to=PIL.MpoImagePlugin \
            --nofollow-import-to=PIL.MspImagePlugin \
            --nofollow-import-to=PIL.PalmImagePlugin \
            --nofollow-import-to=PIL.PcdImagePlugin \
            --nofollow-import-to=PIL.PcxImagePlugin \
            --nofollow-import-to=PIL.PdfImagePlugin \
            --nofollow-import-to=PIL.PixarImagePlugin \
            --nofollow-import-to=PIL.QoiImagePlugin \
            --nofollow-import-to=PIL.SgiImagePlugin \
            --nofollow-import-to=PIL.SunImagePlugin \
            --nofollow-import-to=PIL.TgaImagePlugin \
            --nofollow-import-to=PIL.WmfImagePlugin \
            --nofollow-import-to=PIL.XVThumbImagePlugin \
            --nofollow-import-to=PIL.XbmImagePlugin \
            --nofollow-import-to=PIL.XpmImagePlugin \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=numpy \
            --nofollow-import-to=pandas \
            --include-package-data=certifi \
            ${{ matrix.extra }} \
            ${{ matrix.entry }}
          ccache --show-stats

      - name: verify codec exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dists = list(Path("build/dist").glob("*.dist"))
          if not dists:
              raise SystemExit("No standalone payload available for codec audit")
          forbidden = ("libjpeg", "libtiff", "libopenjp2", "libwebp", "libavif", "liblcms", "libXau", "libxcb")
          for dist in dists:
              for path in dist.rglob("*"):
                  if "zstandard" in path.parts or path.name.startswith(forbidden):
                      raise SystemExit(f"Unwanted codec in payload: {path}")
          report = ET.parse("build/dist/${{ matrix.name }}-report.xml")
          for module in report.iter("module"):
              name = module.get("name", "")
              if name == "zstandard" or name.startswith("zstandard."):
                  raise SystemExit(f"Unwanted module in compilation report: {name}")
          PY

      - name: inspect payload
        run: |
          set -euo pipefail
          # Diagnostic only. Do not fail the release on a hit; this is so the
          # log shows what leaked. Nuitka names the payload after the entry
          # script (main.dist, runtime.dist), not after --output-filename.
          # --onefile still leaves that directory next to the binary.onefile
          echo "=== build/dist ==="
          find build/dist -maxdepth 2 -printf '%y %s %p\n' | sort
          echo
          shopt -s nullglob
          dists=(build/dist/*.dist)
          if [ "${#dists[@]}" -eq 0 ]; then
            echo "no *.dist payload under build/dist"
          fi
          for dist in "${dists[@]}"; do
            echo "=== $dist (top) ==="
            find "$dist" -maxdepth 2 \( -type d -o -type f \) -printf '%y %s %p\n' | sort
            echo
            echo "=== $dist tree ==="
            find "$dist" -printf '%y %s %P\n' | sort
            echo
            echo "=== $dist interesting names ==="
            find "$dist" \( \
              -name '*.py' -o -name '*.pyi' -o -name '*.pyc' -o -name '*.so' \
              -o -name '*.json' -o -name '*.jsonc' -o -name '*.html' -o -name '*.js' \
              -o -name '*.md' -o -name '*.txt' -o -name '*.yml' -o -name '*.yaml' \
              -o -name 'config.json' -o -name '.env' -o -name '*.pem' -o -name '*.key' \
              \) -printf '%s %p\n' | sort || true
            echo
          done

      - name: smoke test
        if: matrix.name == 'vpn-sub'
        run: |
          set -euo pipefail
          # --probe imports the async HTTP/runtime stack and checks res/, lang.jsonc, and
          # config.schema.json were packed. It does not boot the service: a
          # missing config or Redis must not look like a bad binary, and a
          # crash must not look like success. Exit 0 is the only pass.
          build/dist/vpn-sub --probe
          # Run away from the checkout with a temporary DB/config, private Redis,
          # and loopback panel fake; exercise resources, DB, Lua limiter and lifespan.
          python scripts/smoke_async_release.py --binary build/dist/vpn-sub --report build/dist/vpn-sub-report.xml

      - uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.name }}
          path: build/dist/${{ matrix.name }}-report.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/dist/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build/dist
          merge-multiple: true
          pattern: vpn-sub*

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x build/dist/vpn-sub
          test -x build/dist/vpn-sub
          # --notes-from-tag reads a local annotated tag and refuses --repo.
          # Fetch the tag object itself; a checkout of the tagged commit is
          # not an annotated tag, so its message would be lost.
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git tag --list "${GITHUB_REF_NAME}" --format='%(contents)')"
          if [ -z "${notes}" ]; then
            echo "tag ${GITHUB_REF_NAME} has no annotation" >&2
            exit 1
          fi
          printf '%s\n' "${notes}" > notes.md
          release_flags=()
          case "${GITHUB_REF_NAME%%+*}" in
            *-*)
              release_flags+=(--prerelease --latest=false)
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            build/dist/vpn-sub \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${release_flags[@]}" \
            --verify-tag
