      - name: ccache statistics
        if: always()
        run: CCACHE_DIR="$HOME/.cache/ccache" ccache --show-stats --verbose

      - name: verify runtime exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dists = list(Path("build/dist").glob("*.dist"))
          if not dists:
              raise SystemExit("No standalone payload available for codec audit")
          forbidden = ("libjpeg", "libtiff", "libopenjp2", "libwebp", "libavif", "liblcms", "libXau", "libxcb")
          for dist in dists:
              for path in dist.rglob("*"):
                  if "zstandard" in path.parts or path.name.startswith(forbidden):
                      raise SystemExit(f"Unwanted codec in payload: {path}")
          report = ET.parse("build/dist/${{ matrix.name }}-report.xml")
          excluded_modules = (
              "zstandard", "aioquic", "trio", "uvloop",
              "hypercorn.__main__", "hypercorn.run", "hypercorn.middleware",
              "hypercorn.statsd", "hypercorn.asyncio.statsd", "hypercorn.asyncio.udp_server",
              "hypercorn.protocol.h3", "hypercorn.protocol.quic", "hypercorn.trio",
              "telebot.ext", "qrcode.image.pure", "modulefinder", "pyclbr",
              "pstats", "trace", "timeit", "imaplib", "poplib",
              "smtplib", "tarfile", "ftplib", "webbrowser",
              "concurrent.futures.process",
              "concurrent.futures.interpreter", "concurrent.interpreters",
              "werkzeug.serving", "_decimal",
              "_codecs_cn", "_codecs_hk", "_codecs_jp", "_codecs_kr",
              "_codecs_tw", "_codecs_iso2022", "_multibytecodec",
          )
          for module in report.iter("module"):
              name = module.get("name", "")
              if any(name == excluded or name.startswith(excluded + ".") for excluded in excluded_modules):
                  raise SystemExit(f"Unwanted module in compilation report: {name}")
          PY

      - name: inspect payload
        run: |
          set -euo pipefail
          # Diagnostic only. Do not fail the release on a hit; this is so the
          # log shows what leaked. Nuitka names the payload after the entry
          # script (main.dist, runtime.dist), not after --output-filename.
          # --onefile still leaves that directory next to the binary.onefile
          echo "=== build/dist ==="
          find build/dist -maxdepth 2 -printf '%y %s %p\n' | sort
          echo
          shopt -s nullglob
          dists=(build/dist/*.dist)
          if [ "${#dists[@]}" -eq 0 ]; then
            echo "no *.dist payload under build/dist"
          fi
          for dist in "${dists[@]}"; do
            echo "=== $dist (top) ==="
            find "$dist" -maxdepth 2 \( -type d -o -type f \) -printf '%y %s %p\n' | sort
            echo
            echo "=== $dist tree ==="
            find "$dist" -printf '%y %s %P\n' | sort
            echo
            echo "=== $dist interesting names ==="
            find "$dist" \( \
              -name '*.py' -o -name '*.pyi' -o -name '*.pyc' -o -name '*.so' \
              -o -name '*.json' -o -name '*.jsonc' -o -name '*.html' -o -name '*.js' \
              -o -name '*.md' -o -name '*.txt' -o -name '*.yml' -o -name '*.yaml' \
              -o -name 'config.json' -o -name '.env' -o -name '*.pem' -o -name '*.key' \
              \) -printf '%s %p\n' | sort || true
            echo
          done

      - name: smoke test
        if: matrix.name == 'vpn-sub'
        run: |
          set -euo pipefail
          # --probe imports the async HTTP/runtime stack and checks res/, lang.jsonc, and
          # config.schema.json were packed. It does not boot the service: a
          # missing config or Redis must not look like a bad binary, and a
          # crash must not look like success. Exit 0 is the only pass.
          build/dist/vpn-sub --probe
          # Run away from the checkout with a temporary DB/config, private Redis,
          # and loopback panel fake; exercise resources, DB, Lua limiter and lifespan.
          python scripts/smoke_async_release.py --binary build/dist/vpn-sub --report build/dist/vpn-sub-report.xml

      - name: record binary sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("build/dist")
          payloads = list(output.glob("*.dist"))
          if len(payloads) != 1:
              raise SystemExit(f"Expected one standalone payload, found {len(payloads)}")
          compressed = (output / "${{ matrix.name }}").stat().st_size
          raw = sum(path.stat().st_size for path in payloads[0].rglob("*") if path.is_file())
          footer = f"\n---\ncompressed={compressed / 1_000_000:.1f}MB raw={raw / 1_000_000:.1f}MB\n"
          (output / "${{ matrix.name }}-sizes.txt").write_text(footer)
          PY

      - name: pack ccache
        run: tar -cf "$RUNNER_TEMP/ccache.tar" -C "$HOME/.cache/ccache" .

      - name: save ccache
        uses: actions/upload-artifact@v4
        with:
          name: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
          path: ${{ runner.temp }}/ccache.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.name }}
          path: build/dist/${{ matrix.name }}-report.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/dist/${{ matrix.name }}
            build/dist/${{ matrix.name }}-sizes.txt
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build/dist
          merge-multiple: true
          pattern: vpn-sub*

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x build/dist/vpn-sub
          test -x build/dist/vpn-sub
          # --notes-from-tag reads a local annotated tag and refuses --repo.
          # Fetch the tag object itself; a checkout of the tagged commit is
          # not an annotated tag, so its message would be lost.
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git tag --list "${GITHUB_REF_NAME}" --format='%(contents)')"
          if [ -z "${notes}" ]; then
            echo "tag ${GITHUB_REF_NAME} has no annotation" >&2
            exit 1
          fi
          printf '%s\n' "${notes}" > notes.md
          cat build/dist/vpn-sub-sizes.txt >> notes.md
          release_flags=()
          case "${GITHUB_REF_NAME%%+*}" in
            *-*)
              release_flags+=(--prerelease --latest=false)
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            build/dist/vpn-sub \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${release_flags[@]}" \
            --verify-tag
